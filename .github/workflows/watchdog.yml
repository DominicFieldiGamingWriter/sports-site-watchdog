name: Sports Site Watchdog (monitoring paused)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sports-site-watchdog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test watchdog code only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out watchdog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic tests
        run: npm test
