name: Sports Site Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: sports-site-watchdog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test match lifecycle checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out watchdog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic tests
        run: npm test

  monitor:
    name: Check Ben, Hamza and Alex
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out watchdog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pinned Vercel CLI when runtime diagnostics are enabled
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install --no-save --no-package-lock --no-audit --no-fund vercel@65.12.1
          else
            echo "VERCEL_TOKEN is not configured; app-level evidence will still be collected."
          fi

      - name: Run website and data health checks
        run: npm run monitor
        env:
          WATCHDOG_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: dominic-d7cc

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
